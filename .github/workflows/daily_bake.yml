name: AutoTube Engine Run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fonts-dejavu

      - name: Install Dependencies
        run: npm install

      - name: 1. Generate Voice
        run: node index.js

      - name: 2. Mix Audio & Music
        run: node audio-mixer.js

      - name: 3. Render Final Video
        run: node video-engine.js

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AutoTube-Result
          path: final_video.mp4
          
