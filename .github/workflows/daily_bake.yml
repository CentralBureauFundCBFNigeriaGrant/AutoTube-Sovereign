name: AutoTube Autonomous Engine

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      niche:
        description: 'The niche/topic for the video'
        required: true
        default: 'YouTube Growth'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # Added the Brain's API Key
      INPUT_NICHE: ${{ github.event.inputs.niche }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fonts-dejavu
          npm install gtts fluent-ffmpeg googleapis groq-sdk

      - name: 4. Run AutoTube Engine
        run: |
          node index.js
          node audio-mixer.js
          node video-engine.js
          node youtube-uploader.js
          
