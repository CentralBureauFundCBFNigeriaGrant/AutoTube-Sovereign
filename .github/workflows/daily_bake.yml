name: AutoTube Engine Run

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 12 * * *' # Optional: Runs daily at 12:00 PM

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip

      - name: Install Edge TTS (The Secret Weapon)
        run: pip3 install edge-tts

      - name: Install Node Dependencies
        run: npm install axios googleapis

      - name: Run AutoTube Sovereign v5.0
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node video-engine.js
        
