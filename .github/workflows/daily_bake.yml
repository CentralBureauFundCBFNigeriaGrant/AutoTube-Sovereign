name: AutoTube Sovereign v12.0 (Edge TTS Godzilla)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install System Tools, Anton Font, and Aeneas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev python3 python3-pip espeak-ng libespeak-ng-dev
          pip3 install edge-tts
          pip3 install aeneas
          # Download Anton Font for Hormozi Look
          mkdir -p fonts
          wget -O fonts/Anton.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Install Dependencies
        run: npm install

      - name: Run AutoTube Sovereign Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node sovereign.js
