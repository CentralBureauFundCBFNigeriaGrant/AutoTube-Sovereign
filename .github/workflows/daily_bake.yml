name: AutoTube Engine Run

on:
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run AutoTube Engine
        run: node index.js

      # --- THIS IS THE NEW PART ---
      - name: Upload Voiceover Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-file
          path: voiceover.mp3
          retention-days: 1
          
