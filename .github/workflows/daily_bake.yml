name: AutoTube Periodic Run

on:
  schedule:
    - cron: '*/30 * * * *' # Wakes up every 30 minutes
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mapping exactly to the names in your screenshot
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install System Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fonts-dejavu
          npm install gtts fluent-ffmpeg googleapis

      # Running the engine in sequence
      - name: 4. Generate Content (Brain)
        run: node index.js

      - name: 5. Mix Audio (Sound)
        run: node audio-mixer.js

      - name: 6. Render Video (Visuals)
        run: node video-engine.js

      - name: 7. Post to YouTube (Delivery)
        run: node youtube-uploader.js
        
