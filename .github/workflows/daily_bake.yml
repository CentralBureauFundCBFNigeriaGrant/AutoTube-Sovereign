name: AutoTube Engine Run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Step 1: Run Audio Engine
        run: node index.js

      - name: Step 2: Run Video Engine
        run: node video-engine.js

      - name: Upload AutoTube Results
        uses: actions/upload-artifact@v4
        with:
          name: AutoTube-Production-Files
          path: |
            final_video.mp4
            voiceover.mp3
          retention-days: 1
