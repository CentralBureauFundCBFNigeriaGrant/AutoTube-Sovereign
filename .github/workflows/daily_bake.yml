name: AutoTube Engine Run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FIX: Using a dedicated action instead of 'sudo apt-get'
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Dependencies
        run: npm install

      - name: Run Audio Engine
        run: node index.js

      - name: Run Video Engine
        run: node video-engine.js

      - name: Upload AutoTube Results
        uses: actions/upload-artifact@v4
        with:
          name: AutoTube-Production-Files
          path: |
            final_video.mp4
            voiceover.mp3
          retention-days: 1
