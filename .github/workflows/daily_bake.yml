name: AutoTube Autonomous Engine

on:
  schedule:
    # 7 AM, 9 AM, 1 PM, 3 PM, 7 PM, 9 PM (WAT / UTC+1)
    # Cron uses UTC, so we subtract 1 hour from each:
    - cron: '0 6,8,12,14,18,20 * * *'
  workflow_dispatch: 

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ttf-mscorefonts-installer
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections

      - name: Install Dependencies
        run: npm install axios openai @google-cloud/text-to-speech googleapis

      - name: Setup Google Cloud Credentials
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}" > google-creds.json

      - name: Run AutoTube Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GOOGLE_APPLICATION_CREDENTIALS: ./google-creds.json
        run: node video-engine.js

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: |
            output.mp4
            subs.vtt
            
