name: AutoTube Engine Run

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install FFmpeg Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libass-dev fonts-dejavu

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Generate Voice
        run: node index.js

      - name: 6. Mix Audio
        run: node audio-mixer.js

      - name: 7. Render Final Video
        run: node video-engine.js

      - name: 8. Upload Final Video ONLY
        uses: actions/upload-artifact@v4
        with:
          name: Final-Output
          path: final_video.mp4 # No more clutter. Only the result.
          if-no-files-found: error
          
